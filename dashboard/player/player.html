<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emergency response replay</title>
<style>
/*__CSS__*/
</style>
</head>
<body tabindex="0">
<div id="app">
  <header id="top">
    <div id="runlabel"></div>
    <div id="clock"><span class="cap">MINUTE</span><span class="big"><span id="min">0</span><span class="of"> / <span id="last">120</span></span></span></div>
    <div id="controls">
      <button id="play" class="primary" title="Space">&#9654; Play</button>
      <button id="restart" title="Restart from minute 0">&#8634; Restart</button>
      <div id="speeds" role="group" aria-label="Speed">
        <button data-speed="1" class="on">1x</button>
        <button data-speed="2">2x</button>
        <button data-speed="4">4x</button>
      </div>
    </div>
    <div id="scrubber">
      <div id="cmarks" aria-label="Conflicts"></div>
      <input id="scrub" type="range" min="0" max="120" step="0.01" value="0" aria-label="Minute">
      <div id="ticks"></div>
    </div>
    <label id="autopause" title="Pause playback when a conflict appears"><input type="checkbox" id="pausebox" checked><span class="sw"></span>Auto-pause on conflict</label>
  </header>
  <main id="main">
    <section id="mapcol">
      <div id="mapwrap">
        <svg id="map" viewBox="0 0 880 880" preserveAspectRatio="xMidYMid meet" role="img"
             aria-label="Emergency response map"></svg>
        <div id="callout" hidden></div>
      </div>
      <div id="legend"></div>
    </section>
    <aside id="side">
      <div id="kpis" class="kpis"></div>
      <div id="hospitals" class="cards3"></div>
      <div id="resources" class="panel"></div>
      <div id="feedbox" class="panel"><h3>Agent activity <span class="sub" id="feedcount"></span><span id="filter"><button data-f="all" class="on">All</button><button data-f="story" title="Conflicts, counter-offers, accept/reject, executed">Negotiation</button></span></h3><div id="feed"></div></div>
    </aside>
  </main>
  <footer id="strip"></footer>
</div>
<script type="application/json" id="bundle">__BUNDLE__</script>
<script>
/*__JS__*/
</script>
</body>
</html>
