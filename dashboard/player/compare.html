<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compare two systems</title>
<style>
/*__CSS__*/
</style>
</head>
<body tabindex="0">
<div id="app">
  <header id="top">
    <div id="clock"><span class="cap">MINUTE</span><span class="big"><span id="min">0</span><span class="of"> / <span id="last">120</span></span></span></div>
    <div id="controls">
      <button id="play" class="primary" title="Space">&#9654; Play</button>
      <button id="restart" title="Restart from minute 0">&#8634; Restart</button>
      <div id="speeds" role="group" aria-label="Speed">
        <button data-speed="1" class="on">1x</button>
        <button data-speed="2">2x</button>
        <button data-speed="4">4x</button>
      </div>
      <button id="jumpdiff" title="Jump to the first minute the two systems decide differently">&#9873; First difference</button>
    </div>
    <div id="scrubber">
      <div id="cmarks" aria-label="Conflicts and first difference"></div>
      <input id="scrub" type="range" min="0" max="120" step="0.01" value="0" aria-label="Minute">
      <div id="ticks"></div>
    </div>
  </header>
  <div id="diffnote"></div>
  <main id="pair">
    <section class="col"><h2 id="labelA"></h2><iframe id="frameA" title="System A"></iframe></section>
    <section class="col"><h2 id="labelB"></h2><iframe id="frameB" title="System B"></iframe></section>
  </main>
</div>
<script type="application/json" id="data">__DATA__</script>
<script>
/*__JS__*/
</script>
</body>
</html>
