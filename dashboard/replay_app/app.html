<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emergency Response Command Center</title>
<style>
/*__CSS__*/
</style>
</head>
<body tabindex="0">
__SPRITE__
<div id="shell">
  <nav id="rail"></nav>
  <div id="content">
    <header id="topbar">
      <h1>Emergency Response Command Center</h1>
      <div id="legend"></div>
      <div class="top-right">
        <button id="tour" class="ghost" data-tip="Tour|Jump through the key moments of this run"></button>
        <div id="runwrap">
          <button id="runpill" class="pill" aria-haspopup="true"></button>
          <div id="runpop" class="pop" hidden></div>
        </div>
      </div>
    </header>
    <div id="grid">
      <section id="map">
        <svg id="mapsvg" role="img" aria-label="Emergency response map"></svg>
        <div id="callout" hidden></div>
        <div id="tourcard" hidden></div>
        <div class="playbar">
          <button id="play" class="play" data-tip="Play / pause|Space"></button>
          <button id="restart" class="icon-btn" data-tip="Restart|Back to minute 0"></button>
          <div id="speeds" class="seg"><b data-speed="1" class="on">1x</b><b data-speed="2">2x</b><b data-speed="4">4x</b></div>
          <div class="scrub"><div id="cmarks" class="cms"></div><input id="scrub" type="range" min="0" max="120" step="0.01" value="0" aria-label="Minute"><div id="ticks"></div></div>
          <div class="minute"><small>Minute</small><b id="min">0</b><span>/ <span id="last">120</span></span></div>
          <label class="switch" data-tip="Pause on conflict|Stop playback at the minute a conflict appears"><input type="checkbox" id="pausebox" checked><i></i>Pause on conflict</label>
        </div>
      </section>
      <aside id="side">
        <div id="kpis" class="kpis"></div>
        <div id="resources" class="card resources"></div>
        <div>
          <div class="section-head"><h2>Hospitals</h2><div class="legend-mini"><span><i class="bed occ" style="--tone:var(--text-2)"></i>in use</span><span><i class="bed prom"></i>promised</span><span><i class="bed"></i>free</span></div></div>
          <div id="hosps" class="hosps"></div>
        </div>
        <div class="card feed">
          <div class="section-head"><h2>Agent activity <span class="sub" id="feedcount"></span></h2><div id="filter" class="seg"><b data-f="all" class="on">All</b><b data-f="story">Negotiation</b></div></div>
          <div id="timeline" class="timeline"></div>
        </div>
        <div id="neg" class="card negotiation"></div>
      </aside>
    </div>
  </div>
</div>
<div id="tip" hidden></div>
<script type="application/json" id="bundle">__BUNDLE__</script>
<script type="application/json" id="catalog">__CATALOG__</script>
<script>
/*__JS__*/
</script>
</body>
</html>
